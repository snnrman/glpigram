[project]
name = "glpigram"
version = "0.1.0"
description = "GLPIgram — Telegram bot for GLPI IT service management"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0,<4",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
glpigram = "bot.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
# Project code only; the host's ~/.claude tree is not ours to lint.
include = ["bot/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
